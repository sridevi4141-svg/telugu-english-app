<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finance Software</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>



<!-- =========================================
     LANGUAGE DROPDOWN - TOP RIGHT
     ========================================= -->

<div class="language-selector">

    <span>🌐</span>

    <select id="languageSelect">

        <option value="en">
            English
        </option>

        <option value="te">
            తెలుగు
        </option>

    </select>

</div>



<!-- =========================================
     MAIN PAGE
     ========================================= -->

<div class="container">


    <!-- Welcome -->

    <h1 id="welcomeText">
        Hi 👋
    </h1>



    <!-- Finance Software -->

    <h2 class="software-title">
        Finance Software
    </h2>



    <!-- Create Account -->

    <button
        class="create-account-btn"
        onclick="createAccount()">

        📝 Create Account

    </button>



    <!-- Owner / Staff -->

    <div class="cards">


        <!-- Owner -->

        <div
            class="card"
            onclick="ownerLogin()">

            <i class="fa-solid fa-user-tie"></i>

            <h2>
                Owner
            </h2>

        </div>



        <!-- Staff -->

        <div
            class="card"
            onclick="staffLogin()">

            <i class="fa-solid fa-users"></i>

            <h2>
                Staff
            </h2>

        </div>


    </div>


</div>



<!-- LANGUAGE JS -->

<script src="language.js"></script>



<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const languageSelect =
            document.getElementById(
                "languageSelect"
            );


        // Get saved language

        const savedLanguage =
            localStorage.getItem(
                "financeLanguage"
            ) || "en";


        // Show saved language

        languageSelect.value =
            savedLanguage;


        // Apply saved language

        if (
            typeof changeLanguage ===
            "function"
        ) {

            changeLanguage(
                savedLanguage
            );

        }


        // Change language

        languageSelect.addEventListener(
            "change",
            function () {

                changeLanguage(
                    this.value
                );

            }
        );

    }
);

</script>



<script
    type="module"
    src="script.js">
</script>


<script
    type="module"
    src="notification.js">
</script>


</body>

</html>
