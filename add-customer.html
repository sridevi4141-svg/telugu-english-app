<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Customer</title>

<style>
    .form-box{

    width:95%;
    max-width:500px;
    margin:30px auto;
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);

}

.form-box label{

    display:block;
    margin-top:12px;
    margin-bottom:5px;
    font-weight:bold;

}

.form-box input{

    width:100%;
    box-sizing:border-box;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;

}
.save-btn{

    width:100%;
    padding:15px;
    background:#4CAF50;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;

}

.location-btn{

    width:100%;

    padding:14px;

    margin-top:10px;

    margin-bottom:15px;

    border:none;

    border-radius:8px;

    background:#ff9800;

    color:white;

    font-size:17px;

    cursor:pointer;

}

.location-btn:hover{

    background:#f57c00;

}

@media screen and (max-width:768px){

    body{

        margin:0;
        padding:10px;
        background:#f5f5f5;

    }

    .form-box{

        width:100%;
        max-width:100%;
        margin:10px auto;
        padding:15px;
        box-sizing:border-box;

    }

    h2{

        font-size:22px;
        text-align:center;

    }

    .back-btn{

        width:100%;
        margin-bottom:15px;

    }

    .save-btn,
    .location-btn{

        width:100%;
        font-size:17px;

    }

}

.language-bar{
    width:95%;
    max-width:500px;
    margin:15px auto 0;
    text-align:right;
}

.language-bar select{
    padding:8px 10px;
    border-radius:7px;
    border:1px solid #ccc;
}

.voice-row{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:15px;
}

.voice-row input{
    margin-bottom:0;
}

.voice-btn{
    padding:12px;
    border:none;
    border-radius:8px;
    background:#1565c0;
    color:white;
    cursor:pointer;
    white-space:nowrap;
}

.voice-btn.listening{
    background:#d32f2f;
}
</style>

</head>

<body>


<div class="top-bar">

    <button class="back-btn" onclick="history.back()">
        <span data-i18n="back">⬅ Back</span>
    </button>

    <h2 data-i18n="addCustomer">Add Customer</h2>

</div>

<!-- Form Start -->

<div class="form-box">

    <label data-i18n="serialNumber">Serial Number</label>

    <input type="number"
           id="serialNo"
              placeholder="Serial Number" data-i18n-placeholder="serialNumber">
        

    <label data-i18n="customerName">Customer Name</label>

    <div class="voice-row">
        <input type="text"
               id="customerName"
               placeholder="Customer Name"
               data-i18n-placeholder="customerName">
        <button type="button" class="voice-btn" onclick="startVoice('customerName', this)">
            <span data-i18n="speak">🎤 Speak</span>
        </button>
    </div>

    <label data-i18n="relation">Relation</label>

    <div class="voice-row">
        <input type="text"
               id="relation"
               placeholder="W/o, S/o or D/o" data-i18n-placeholder="relation">
        <button type="button" class="voice-btn" onclick="startVoice('relation', this)">
            <span data-i18n="speak">🎤 Speak</span>
        </button>
    </div>

    <label data-i18n="village">Village</label>

    <div class="voice-row">
        <input type="text"
               id="village"
               placeholder="Village"
               data-i18n-placeholder="village">
        <button type="button" class="voice-btn" onclick="startVoice('village', this)">
            <span data-i18n="speak">🎤 Speak</span>
        </button>
    </div>

    <label data-i18n="phoneNumber">Phone Number</label>

    <input type="tel"
           id="phone"
           maxlength="10"
           placeholder="Phone Number" data-i18n-placeholder="phoneNumber">

    <label data-i18n="aadhaarNumber">Aadhaar Number</label>

    <input type="text"
           id="aadhar"
           maxlength="12"
           placeholder="Aadhaar Number" data-i18n-placeholder="aadhaarNumber">

    <label data-i18n="customerPhoto">Customer Photo</label>

<input
    type="file"
    id="customerPhoto"
    accept="image/*">

<label data-i18n="liveLocation">Live Location</label>

<input
    type="text"
    id="location"
    placeholder="Click Get Location"
    >

<button
    type="button"
    class="location-btn"
    onclick="getLocation()">

    <span data-i18n="getLiveLocation">📍 Get Live Location</span>

</button><br><br>


    <button class="save-btn"
            onclick="saveCustomer()">

        <span data-i18n="saveCustomer">Save Customer</span>

    </button>

</div>

<script src="language.js"></script>
<script type="module" src="customer.js"></script>

</body>

</html>
